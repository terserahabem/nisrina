<!DOCTYPE html>
<html lang="id">

<head>
	<title>Selamat Ulang Tahun, Nisrina Irawanto</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
	<link rel="stylesheet" type="text/css" href="style.css" />
	<style type="text/css">
		body {
			overflow: hidden;
			background: black;
			width: 100%;
			height: 100vh;
		}

		.bg {
			width: 100%;
			height: 100vh;
			position: absolute;
			z-index: -1;
		}

		.ubuntu {
			background: linear-gradient(to left, #8942A8, #BA382F);
			opacity: 0;
		}

		.dawn {
			background: linear-gradient(0deg, rgba(133, 26, 0, 1) 3%, rgba(255, 51, 0, 1) 19%, rgba(181, 103, 47, 1) 45%, rgba(52, 142, 200, 1) 100%);
			opacity: 0;
		}

		.morning {
			background: linear-gradient(0deg, rgba(255, 230, 113, 1) 0%, rgba(82, 167, 255, 1) 100%);
			opacity: 0;
		}

		.noon {
			background: linear-gradient(0deg, rgba(22, 183, 255, 1) 0%, rgba(14, 116, 223, 1) 58%, rgba(1, 7, 170, 1) 100%);
			opacity: 0;
		}

		.afternoon {
			background: linear-gradient(0deg, rgba(161, 133, 255, 1) 0%, rgba(0, 118, 226, 1) 61%, rgba(1, 81, 170, 1) 100%);
			opacity: 0;
		}

		.sunset {
			background: linear-gradient(0deg, rgba(195, 75, 42, 1) 0%, rgba(129, 29, 121, 1) 8%, rgba(89, 1, 170, 1) 29%, rgba(1, 5, 79, 1) 90%);
			opacity: 0;
		}

		.evening {
			background: linear-gradient(0deg, rgba(0, 7, 128, 1) 0%, rgba(0, 3, 54, 1) 100%);
			opacity: 0;
		}

		.midnight {
			background: linear-gradient(0deg, rgba(0, 3, 60, 1) 0%, rgba(0, 0, 0, 1) 100%);
			opacity: 0;
		}

		.red {
			background: linear-gradient(90deg, rgba(255, 0, 255, 1) 0%, rgba(255, 0, 0, 1) 50%, rgba(255, 255, 0, 1) 100%);
			opacity: 0;
		}

		.green {
			background: linear-gradient(90deg, rgba(255, 255, 0, 1) 0%, rgba(0, 255, 0, 1) 50%, rgba(0, 255, 255, 1) 100%);
			opacity: 0;
		}

		.blue {
			background: linear-gradient(90deg, rgba(0, 255, 255, 1) 0%, rgba(0, 0, 255, 1) 50%, rgba(255, 0, 255, 1) 100%);
			opacity: 0;
		}

		.jam,
		.ucapan,
		.quotes {
			margin: 0px;
			padding: 0px;
			position: absolute;
			color: #fff;
			transition: all 5s ease, color 1s ease;
		}

		.jam {
			opacity: 0;
			font-size: 100pt;
			left: 50%;
			bottom: 50%;
			transform: translate(-50%, calc(50% - 0px));
		}

		.ucapan {
			font-size: 25pt;
			left: 50%;
			bottom: 50%;
			width: 90%;
			text-align: center;
			transform: translate(-50%, calc(50% + 110px));
		}

		.sub-ucapan {
			font-size: 14pt;
			margin-top: 6px;
			opacity: 0.9;
		}

		.quotes {
			left: 50%;
			bottom: 15px;
			width: 85%;
			transform: translate(-50%, 0%);
			text-align: center;
			font-size: 15pt;
			text-shadow: 0px 0px 10px #000;
		}

		.kontrol {
			margin: 20px;
			background: #fff;
			padding: 20px;
			position: absolute;
			width: 200px;
			min-height: 250px;
			border-radius: 10px;
			left: -220px;
			transition: all 1 ease;
			z-index: 99;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
		}

		.panah {
			content: '';
			width: 20px;
			height: 20px;
			position: absolute;
			top: 75px;
			right: -30px;
			border: 5px solid white;
			border-bottom: none;
			border-left: none;
			border-radius: 5px;
			border-top-left-radius: 3px;
			border-bottom-right-radius: 3px;
			transform: rotate(45deg);
			z-index: 50;
			cursor: pointer;
			transition: transform 0.3s ease, border-color 0.5s ease;
		}

		.panah2 {
			content: '';
			width: 20px;
			height: 20px;
			position: absolute;
			top: 120px;
			right: -30px;
			border: 5px solid white;
			border-bottom: none;
			border-left: none;
			border-radius: 5px;
			border-top-left-radius: 3px;
			border-bottom-right-radius: 3px;
			transform: rotate(45deg);
			z-index: 50;
			cursor: pointer;
			transition: transform 0.3s ease, border-color 0.5s ease;
		}

		.panah3 {
			content: '';
			width: 20px;
			height: 20px;
			position: absolute;
			top: 165px;
			right: -30px;
			border: 5px solid white;
			border-bottom: none;
			border-left: none;
			border-radius: 5px;
			border-top-left-radius: 3px;
			border-bottom-right-radius: 3px;
			transform: rotate(45deg);
			z-index: 50;
			cursor: pointer;
			transition: transform 0.3s ease, border-color 0.5s ease;
		}

		#isi-lagu {
			display: none;
		}

		.lagu-box {
			background: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
			border: 1px solid #ffc2d1;
			border-radius: 8px;
			padding: 12px;
			text-align: center;
			margin-bottom: 10px;
		}

		.lagu-judul {
			font-weight: bold;
			font-size: 10.5pt;
			color: #c9184a;
			margin-bottom: 4px;
		}

		.lagu-status {
			font-size: 8.5pt;
			color: #666;
			margin-bottom: 10px;
		}

		.lagu-controls {
			display: flex;
			justify-content: center;
			gap: 8px;
			margin-bottom: 4px;
		}

		.lagu-controls button {
			min-width: 68px;
			font-weight: bold;
			border-radius: 20px;
		}

		.lagu-list {
			max-height: 150px;
			overflow-y: auto;
			text-align: left;
			margin-top: 8px;
			border-top: 1px solid #eee;
			padding-top: 6px;
		}

		.lagu-item {
			padding: 5px 8px;
			font-size: 9pt;
			border-radius: 5px;
			cursor: pointer;
			color: #444;
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.lagu-item:hover {
			background: #f8f9fa;
		}

		.lagu-item.aktif {
			background: #ffe3e8;
			color: #c9184a;
			font-weight: bold;
		}

		#isi-galeri {
			display: none;
			max-height: 75vh;
			overflow-y: auto;
			padding-right: 4px;
		}

		.galeri-header {
			font-weight: bold;
			font-size: 14pt;
			color: #333;
			text-align: center;
			margin-bottom: 4px;
		}

		.galeri-sub {
			font-size: 9pt;
			color: #777;
			text-align: center;
			margin-bottom: 12px;
		}

		.galeri-grid {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 10px;
		}

		.galeri-item {
			background: #f8f9fa;
			border: 1px solid #e2e6ea;
			border-radius: 8px;
			padding: 6px;
			text-align: center;
			cursor: pointer;
			transition: transform 0.2s ease, box-shadow 0.2s ease;
			position: relative;
		}

		.galeri-item:hover {
			transform: translateY(-2px);
			box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
		}

		.galeri-item img {
			width: 100%;
			height: 110px;
			object-fit: cover;
			border-radius: 5px;
			background: #eee;
		}

		.galeri-caption {
			font-size: 8.5pt;
			color: #444;
			margin-top: 5px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.galeri-actions {
			margin-top: 12px;
			text-align: center;
		}

		.hapus-foto {
			position: absolute;
			top: 8px;
			right: 8px;
			background: rgba(220, 53, 69, 0.85);
			color: #fff;
			border: none;
			border-radius: 50%;
			width: 20px;
			height: 20px;
			font-size: 11px;
			line-height: 18px;
			cursor: pointer;
			padding: 0;
		}

		.lightbox-overlay {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.85);
			z-index: 9999;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			padding: 20px;
		}

		.lightbox-overlay img {
			max-width: 90%;
			max-height: 80vh;
			border-radius: 10px;
			border: 4px solid #fff;
			box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
		}

		.lightbox-caption {
			color: #fff;
			margin-top: 12px;
			font-size: 13pt;
			text-align: center;
		}

		.lightbox-close {
			position: absolute;
			top: 20px;
			right: 30px;
			color: #fff;
			font-size: 30pt;
			cursor: pointer;
			line-height: 1;
		}

		.kotak {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			overflow: hidden;
			z-index: -1;
		}

		.kotak li {
			position: absolute;
			display: block;
			list-style: none;
			width: 25px;
			height: 25px;
			background: rgba(255, 255, 255, 0.2);
			animation: animate 20s linear infinite;
			bottom: -150px;
			transition: all 1s ease;
		}

		.kotak li:nth-child(1) {
			left: 86%;
			width: 80px;
			height: 80px;
			animation-delay: 0s;
		}

		.kotak li:nth-child(2) {
			left: 12%;
			width: 30px;
			height: 30px;
			animation-delay: 1.5s;
			animation-duration: 10s;
		}

		.kotak li:nth-child(3) {
			left: 70%;
			width: 100px;
			height: 100px;
			animation-delay: 5.5s;
		}

		.kotak li:nth-child(4) {
			left: 42%;
			width: 150px;
			height: 150px;
			animation-delay: 0s;
			animation-duration: 15s;
		}

		.kotak li:nth-child(5) {
			left: 15%;
			width: 110px;
			height: 110px;
			animation-delay: 3.5s;
		}

		.bulat {
			position: absolute;
			width: 600px;
			height: 600px;
			display: flex;
			left: 50%;
			bottom: 50%;
			transform: translate(-50%, 50%) scale(0);
			transition: 3s all ease;
		}

		.bulat span:nth-child(1) {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: 2px solid #fff;
			border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
			transition: 0.5s;
			animation: animate2 6s linear infinite;
		}

		.bulat span:nth-child(2) {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: 2px solid #fff;
			border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
			transition: 0.5s;
			animation: animate3 4s linear infinite;
		}

		.bulat span:nth-child(3) {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			border: 5px solid #fff;
			border-radius: 38% 62% 63% 37% / 41% 44% 56% 59%;
			transition: 0.5s;
			animation: animate2 10s linear infinite;
		}

		@keyframes animate {
			0% {
				transform: translateY(0) rotate(0deg);
				opacity: 1;
			}

			100% {
				transform: translateY(-100vh) rotate(360deg);
				opacity: 0;
			}
		}

		@keyframes animate2 {
			0% {
				transform: rotate(0deg);
			}

			100% {
				transform: rotate(360deg);
			}
		}

		@keyframes animate3 {
			0% {
				transform: rotate(360deg);
			}

			100% {
				transform: rotate(0deg);
			}
		}

		@media only screen and (max-width: 900px),
		screen and (max-height: 700px) {

			.jam,
			.ucapan {
				transition: all 1s ease;
			}

			.jam {
				font-size: 50pt;
				transform: translate(-50%, calc(50% - 0px));
			}

			.ucapan {
				font-size: 15pt;
				transform: translate(-50%, calc(50% + 55px));
			}

			.sub-ucapan {
				font-size: 10pt;
			}

			.quotes {
				font-size: 10pt;
			}

			.bulat {
				width: 300px;
				height: 300px;
			}
		}

		@media only screen and (max-width: 500px) {
			.ucapan {
				font-size: 11pt;
			}

			.sub-ucapan {
				font-size: 8pt;
			}

			.quotes {
				font-size: 8pt;
			}
		}
	</style>
</head>

<body onload="init_auto()">

			<div class="custom-control custom-radio">

			<div class="custom-control custom-radio">
				<input type="radio" class="custom-control-input" id="customRadio2" name="example1">

			</div>
			<div class="custom-control custom-radio">
				<input type="radio" class="custom-control-input" id="customRadio3" name="example1">
				<label class="custom-control-label" for="customRadio3">Morning</label>
			</div>
			<div class="custom-control custom-radio">
				<input type="radio" class="custom-control-input" id="customRadio4" name="example1">
				<label class="custom-control-label" for="customRadio4">Noon</label>
			</div>
			<div class="custom-control custom-radio">
				<input type="radio" class="custom-control-input" id="customRadio5" name="example1">
				<label class="custom-control-label" for="customRadio5">Afternoon</label>
			</div>
			<div class="custom-control custom-radio">
				<input type="radio" class="custom-control-input" id="customRadio6" name="example1">

			</div>
			<div class="custom-control custom-radio">
				<input type="radio" class="custom-control-input" id="customRadio7" name="example1">

			<div class="custom-control custom-radio">
				<input type="radio" class="custom-control-input" id="customRadio8" name="example1">

			</div>
		</div>
		<div id="isi-galeri">
			<div class="galeri-header">Kita Abadi</div>

					onclick="document.getElementById('inputFotoGaleri').click()">+ Tambah Foto</button>

		<div id="isi-lagu">
			<div class="galeri-header">Musik Romantis 🎵</div>

			<div class="lagu-box">
				<div class="lagu-judul" id="judulLaguAktif">Melodi Cinta Nisrina</div>
				<div class="lagu-status" id="statusLaguAktif">🎵 Sedang Memutar...</div>
				<div class="lagu-controls">
					<button type="button" class="btn btn-sm btn-success" id="btnLaguPlay" onclick="playLagu()">▶
						Play</button>
					<button type="button" class="btn btn-sm btn-danger" id="btnLaguStop" onclick="stopLagu()">⏹

	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js"></script>
	<script type="text/javascript">
		gaming = false;
		panelAktif = null; // null, 'tema', 'galeri', atau 'lagu'

		function tutupPanel() {
			var lebar = $(".kontrol").outerWidth();
			$(".panah, .panah2, .panah3").css("transform", "rotate(45deg)");
			$(".kontrol").stop().animate({ left: (-lebar - 20) + "px" }, 300);
			panelAktif = null;
		}

		$(".panah").click(function (e) {
			e.stopPropagation();
			if (panelAktif !== 'tema') {
				var wasClosed = (panelAktif === null);
				$("#isi-galeri, #isi-lagu").hide();
				$("#isi-tema").show();
				$(".kontrol").css("width", "200px");
				if (wasClosed) {
					$(".kontrol").css("left", "-220px");
				}
				$(".panah").css("transform", "rotate(225deg)");
				$(".panah2, .panah3").css("transform", "rotate(45deg)");
				$(".kontrol").stop().animate({ left: "0px" }, 300);
				panelAktif = 'tema';
			} else {
				tutupPanel();
			}
		});

		$(".panah2").click(function (e) {
			e.stopPropagation();
			if (panelAktif !== 'galeri') {
				var wasClosed = (panelAktif === null);
				$("#isi-tema, #isi-lagu").hide();
				$("#isi-galeri").show();
				var targetWidth = Math.min(340, $(window).width() - 70);
				$(".kontrol").css("width", targetWidth + "px");
				if (wasClosed) {
					$(".kontrol").css("left", (-targetWidth - 20) + "px");
				}
				$(".panah2").css("transform", "rotate(225deg)");
				$(".panah, .panah3").css("transform", "rotate(45deg)");
				$(".kontrol").stop().animate({ left: "0px" }, 300);
				panelAktif = 'galeri';
			} else {
				tutupPanel();
			}
		});

		$(".panah3").click(function (e) {
			e.stopPropagation();
			if (panelAktif !== 'lagu') {
				var wasClosed = (panelAktif === null);
				$("#isi-tema, #isi-galeri").hide();
				$("#isi-lagu").show();
				var targetWidth = Math.min(300, $(window).width() - 70);
				$(".kontrol").css("width", targetWidth + "px");
				if (wasClosed) {
					$(".kontrol").css("left", (-targetWidth - 20) + "px");
				}
				$(".panah3").css("transform", "rotate(225deg)");
				$(".panah, .panah2").css("transform", "rotate(45deg)");
				$(".kontrol").stop().animate({ left: "0px" }, 300);
				panelAktif = 'lagu';
			} else {
				tutupPanel();
			}

		function pastikanAudioCtx() {
			if (!audioCtx) {

				if (AudioContextClass) {
					audioCtx = new AudioContextClass();
				}
			}
			if (audioCtx && audioCtx.state === "suspended") {

		function bunyikanNada(freq, durasiMs, volume, tipeOsc) {
			if (!audioCtx || !freq) return;
			try {
				var now = audioCtx.currentTime;
				var osc = audioCtx.createOscillator();
				var gain = audioCtx.createGain();
				osc.type = tipeOsc || "sine";
				osc.frequency.setValueAtTime(freq, now);

				var durSec = Math.max(0.15, (durasiMs / 1000) * 1.15);
				gain.gain.setValueAtTime(0.0001, now);
				gain.gain.linearRampToValueAtTime(volume, now + 0.03);
				gain.gain.exponentialRampToValueAtTime(0.0001, now + durSec);

				osc.connect(gain);
				gain.connect(audioCtx.destination);
				osc.start(now);
				osc.stop(now + durSec + 0.05);
			} catch (e) { }
		}

			var lagu = daftarLaguRomantis[indexLaguAktif];

			pastikanAudioCtx();
			if (audioCtx && audioCtx.state === "suspended") {
				timerNada = setTimeout(jalankanStepSynth, 250);
				return;
			}

			if (stepNada >= lagu.notes.length) {
				stepNada = 0;
			}
			var item = lagu.notes[stepNada];
			var durMs = (item.d || 1) * (lagu.tempo || 380);
			if (item.m) bunyikanNada(item.m, durMs, 0.16, "sine");
			if (item.m) bunyikanNada(item.m * 2, durMs * 0.6, 0.03, "triangle");
			if (item.b) bunyikanNada(item.b, durMs * 1.4, 0.08, "triangle");

			stepNada++;
			timerNada = setTimeout(jalankanStepSynth, durMs);
		}
